name: nextjs-pr-preview-demo
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_OWNER/digitalocean-nextjs-pr-previews
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
